production: &production
  freezer_reminder:
    class: Reminders::FreezerJob
    queue: default
    schedule: every day at 6pm
  batch_session_reminder:
    class: Reminders::BatchSessionJob
    queue: default
    schedule: every saturday at 10am
  demo_reset:
    class: DemoResetJob
    queue: default
    schedule: every day at 4am

development:
  <<: *production
